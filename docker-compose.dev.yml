services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: site_dev
      POSTGRES_USER: site_dev
      POSTGRES_PASSWORD: site_dev_local_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - site-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_dev -d site_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  site-dev-postgres:
