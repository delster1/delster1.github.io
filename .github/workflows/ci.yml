name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Reject tracked credential files
        run: |
          if git ls-files | grep -E '(^|/)(\.dev\.vars($|\.)|\.env($|\.)|[^/]*\.(pem|key|p12|pfx)$)' | grep -vE '\.example$'; then
            echo "::error::Credential-bearing files must not be tracked."
            exit 1
          fi
      - run: npm run build
        env:
          BETTER_AUTH_URL: https://d3llie.tech
